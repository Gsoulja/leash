# Leash: one command starts everything (LEASH-127). See solution/RUNBOOK.md.
#   docker compose -p leash-local -f solution/docker-compose.yml -f solution/docker-compose.local.yml --profile fake up -d --build  # local
#   docker compose -f solution/docker-compose.yml up -d --build                  # event day (set .env first)
# Order: db healthy → migrate (migrations + pack seed, idempotent) → api and worker. Readiness (/readyz) fails
# until migrations and the seed are done. The worker talks to LEASH_BASE_URL; the default is the local fake,
# so nothing reaches the live platform unless it is set explicitly.
x-engine: &engine
  image: leash-engine:local
  build:
    context: ..
    dockerfile: solution/engine/Dockerfile
    args:
      # LEASH-151: the revision the frontend bundle is stamped with, and the one the API expects to be
      # serving. Set it to the commit being demoed:
      #   APP_REVISION=$(git rev-parse --short HEAD) docker compose ... up -d --build
      APP_REVISION: ${APP_REVISION:-dev}
  environment: &engine-env
    DATABASE_URL: postgresql://leash:${LEASH_DB_PASSWORD:-leash}@db:5432/leash
    TEAM_API_KEY: ${TEAM_API_KEY:-fake-team-key}
    LEASH_BASE_URL: ${LEASH_BASE_URL:-http://fake:9000}
    LEASH_CORS_ORIGINS: ${LEASH_CORS_ORIGINS:-http://localhost:5173}
    LEASH_LOG_LEVEL: ${LEASH_LOG_LEVEL:-INFO}
    OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    LEASH_JEV_MODEL: ${LEASH_JEV_MODEL:-typesafe/jev-1.13}
    LEASH_JEV_RULE_MODE: ${LEASH_JEV_RULE_MODE:-shadow}
    LEASH_JEV_RULE_THRESHOLD: ${LEASH_JEV_RULE_THRESHOLD:-0.9}
    LEASH_FACT_READER: ${LEASH_FACT_READER:-jev}
    LEASH_RULE_CLASSIFIER: ${LEASH_RULE_CLASSIFIER:-jev}
    # Where the chat's calls go on to (LEASH-175). Unset means no assistant in this deployment, and the
    # chat is told so plainly rather than shown a 404.
    LEASH_ASSISTANT_URL: ${LEASH_ASSISTANT_URL:-http://assistant:8100}

services:
  db:
    image: postgres:17@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
    environment:
      POSTGRES_USER: leash
      POSTGRES_PASSWORD: ${LEASH_DB_PASSWORD:-leash}  # applies when the volume is first created
      POSTGRES_DB: leash
    ports:
      - "${LEASH_DB_PORT:-55432}:5432"
    volumes:
      - leash-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leash -d leash"]
      interval: 2s
      timeout: 3s
      retries: 20

  migrate:
    <<: *engine
    command: ["leash-migrate"]
    depends_on:
      db: {condition: service_healthy}
    restart: "no"

  api:
    <<: *engine
    command: ["leash-api"]
    ports:
      - "${LEASH_API_PORT:-8080}:8080"
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/readyz', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  worker:
    <<: *engine
    command: ["leash-worker"]
    ports:
      - "${LEASH_WORKER_HEALTH_PORT:-8081}:8081"
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/healthz', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20
    stop_grace_period: 30s
    restart: unless-stopped

  # LEASH-151: one command, and it refuses to touch anything but a local demo database.
  #   docker compose -f solution/docker-compose.yml --profile reset run --rm reset
  # The permission assistant (LEASH-175): reads the customer's words with the model and hands what
  # survives validation to `api`, which validates every rule again and is the only thing that stores or
  # activates one. It holds no database credential and no platform key.
  #   LEASH_ASSISTANT_MODEL=offline runs it without a model, for rehearsals and CI. It then reads with
  #   the deterministic compiler, which is a test double and not a fallback: a model being *down* must
  #   become questions for the customer, never a quiet second-best reading.
  assistant:
    <<: *engine
    command: ["python", "-m", "assistant.service"]
    environment:
      <<: *engine-env
      DATABASE_URL: ""  # it holds no database credential, and nothing in it reads one
      TEAM_API_KEY: ""  # nor the platform key: it cannot reach the control layer (DEC-044)
      LEASH_ASSISTANT_MODEL: ${LEASH_ASSISTANT_MODEL:-openrouter}
      LEASH_MODEL: ${LEASH_MODEL:-google/gemini-3.8-flash}
      LEASH_MODEL_BASE_URL: ${LEASH_MODEL_BASE_URL:-https://openrouter.ai/api/v1}
      LEASH_MODEL_REASONING: ${LEASH_MODEL_REASONING:-low}
      LEASH_POLICY_URL: ${LEASH_POLICY_URL:-http://api:8080}
      LEASH_CARD_ID: ${LEASH_CARD_ID:-CA0001}
      LEASH_SIM_CUTOFF: ${LEASH_SIM_CUTOFF:-2026-08-09T00:00:00Z}
      LEASH_PACK_DIR: ${LEASH_PACK_DIR:-/repo/data}  # where the image puts the pack (see LEASH_DATA_DIR)
      PORT: "8100"
      HOST: "0.0.0.0"
    ports:
      - "${LEASH_ASSISTANT_PORT:-8100}:8100"
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/healthz', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  reset:
    <<: *engine
    profiles: ["reset"]
    command: ["leash-reset", "--yes"]
    environment:
      <<: *engine-env
      LEASH_ALLOW_DEMO_RESET: "1"
    depends_on:
      # after the migrations, not merely after the database: a reset on an unmigrated volume would
      # otherwise fail on a missing table rather than doing anything useful
      migrate: {condition: service_completed_successfully}
    restart: "no"

  fake:
    <<: *engine
    profiles: ["fake"]
    command: ["uvicorn", "--factory", "fake_api.serve:create_app", "--host", "0.0.0.0", "--port", "9000"]
    environment:
      <<: *engine-env
      PYTHONPATH: tests
      FAKE_API_KEY: ${TEAM_API_KEY:-fake-team-key}
    ports:
      - "${LEASH_FAKE_PORT:-9000}:9000"

volumes:
  leash-db-data:

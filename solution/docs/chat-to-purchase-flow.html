}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

html&gt;body{padding:0}&lt;/style&gt;

&lt;body&gt;
&lt;div id=&quot;chat-to-purchase-flow&quot;&gt;
&lt;style&gt;
#chat-to-purchase-flow .journey { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:16px 0; }
#chat-to-purchase-flow .story { display:grid; grid-template-columns:minmax(0,1.3fr) minmax(0,1fr); gap:24px; margin-top:20px; align-items:start; }
#chat-to-purchase-flow .notes { display:grid; gap:16px; }
#chat-to-purchase-flow .notes strong { font-weight:500; }
#chat-to-purchase-flow .notes p { margin:4px 0 0; }
#chat-to-purchase-flow .phone { --p-bg:light-dark(#ffffff,#171b20); --p-fg:light-dark(#20282c,#edf0ef); --p-muted:light-dark(#57646b,#b6c1c5); --p-line:light-dark(#d6dfde,#404b50); --p-fill:light-dark(#edf3f1,#26332f); --p-action:light-dark(#185a49,#a9ddc8); --p-on-action:light-dark(#ffffff,#143629); color:var(--p-fg); background:var(--p-bg); border:1px solid var(--p-line); border-radius:20px; padding:20px; font-family:system-ui,sans-serif; font-size:14px; line-height:1.5; }
#chat-to-purchase-flow .phone * { box-sizing:border-box; }
#chat-to-purchase-flow .phone header { display:flex; flex-wrap:wrap; justify-content:space-between; gap:8px; padding-bottom:14px; border-bottom:1px solid var(--p-line); margin-bottom:18px; }
#chat-to-purchase-flow .phone .small { font-size:12px; color:var(--p-muted); }
#chat-to-purchase-flow .phone .bubble { background:var(--p-fill); padding:12px 14px; border-radius:14px 14px 3px 14px; margin:14px 0 14px 25px; }
#chat-to-purchase-flow .phone .reply { margin:14px 20px 14px 0; }
#chat-to-purchase-flow .phone .permission { border:1px solid var(--p-line); border-radius:12px; padding:14px; margin:16px 0; }
#chat-to-purchase-flow .phone .permission div { display:flex; justify-content:space-between; gap:12px; padding:7px 0; border-bottom:1px solid var(--p-line); }
#chat-to-purchase-flow .phone .permission div:last-child { border:0; }
#chat-to-purchase-flow .phone .permission b { font-weight:500; text-align:right; }
#chat-to-purchase-flow .phone .action { display:block; text-align:center; text-decoration:none; color:var(--p-on-action); background:var(--p-action); padding:12px; border-radius:10px; margin-top:10px; font-weight:500; }
#chat-to-purchase-flow .phone .secondary { color:var(--p-fg); background:var(--p-fill); }
#chat-to-purchase-flow .phone .composer { padding:12px; border:1px solid var(--p-line); border-radius:10px; color:var(--p-muted); margin-top:22px; }
#chat-to-purchase-flow .phone .status { font-size:20px; font-weight:500; margin:8px 0; }
#chat-to-purchase-flow .phone ol { padding-left:20px; }
#chat-to-purchase-flow .phone li { margin:12px 0; }
#chat-to-purchase-flow .phone .choices { display:flex; flex-wrap:wrap; gap:8px; }
#chat-to-purchase-flow .phone .choice { border:1px solid var(--p-line); border-radius:8px; padding:8px 10px; }
#chat-to-purchase-flow details { padding:12px 0; border-bottom:1px solid var(--border); }
#chat-to-purchase-flow summary { cursor:pointer; min-height:32px; }
@media(max-width:570px) { #chat-to-purchase-flow .story { grid-template-columns:1fr; } }
&lt;/style&gt;
&lt;h2&gt;From “buy me…” to a purchase the customer controls&lt;/h2&gt;&lt;p&gt;Agreed direction · 24 September 2026. Leash clarifies permission; an external agent shops. Background preferences suggest questions, never permission. Review the exact rules as Must follow / May choose / Must ask; corrections require a new revision and confirmation. After activation, hand off to the shopping agent. These screens remain illustrative.&lt;/p&gt;
&lt;div class=&quot;journey&quot; aria-label=&quot;Journey: describe, clarify, confirm, shop, check, outcome&quot;&gt;
&lt;span&gt;Describe&lt;/span&gt;&lt;span aria-hidden=&quot;true&quot;&gt;→&lt;/span&gt;&lt;span&gt;Clarify&lt;/span&gt;&lt;span aria-hidden=&quot;true&quot;&gt;→&lt;/span&gt;&lt;span&gt;Confirm&lt;/span&gt;&lt;span aria-hidden=&quot;true&quot;&gt;→&lt;/span&gt;&lt;span&gt;Shop&lt;/span&gt;&lt;span aria-hidden=&quot;true&quot;&gt;→&lt;/span&gt;&lt;span&gt;Check&lt;/span&gt;&lt;span aria-hidden=&quot;true&quot;&gt;→&lt;/span&gt;&lt;span&gt;Outcome&lt;/span&gt;
&lt;/div&gt;
&lt;div class=&quot;nav nav-pills&quot; role=&quot;tablist&quot; aria-label=&quot;Designer storyboard&quot;&gt;
&lt;button type=&quot;button&quot; class=&quot;nav-link active&quot; id=&quot;journey-t1&quot; role=&quot;tab&quot; aria-controls=&quot;journey-s1&quot; aria-selected=&quot;true&quot;&gt;1 · Chat&lt;/button&gt;
&lt;button type=&quot;button&quot; class=&quot;nav-link&quot; id=&quot;journey-t2&quot; role=&quot;tab&quot; aria-controls=&quot;journey-s2&quot; aria-selected=&quot;false&quot;&gt;2 · Clarify&lt;/button&gt;
&lt;button type=&quot;button&quot; class=&quot;nav-link&quot; id=&quot;journey-t3&quot; role=&quot;tab&quot; aria-controls=&quot;journey-s3&quot; aria-selected=&quot;false&quot;&gt;3 · Confirm&lt;/button&gt;
&lt;button type=&quot;button&quot; class=&quot;nav-link&quot; id=&quot;journey-t4&quot; role=&quot;tab&quot; aria-controls=&quot;journey-s4&quot; aria-selected=&quot;false&quot;&gt;4 · Shop&lt;/button&gt;
&lt;button type=&quot;button&quot; class=&quot;nav-link&quot; id=&quot;journey-t5&quot; role=&quot;tab&quot; aria-controls=&quot;journey-s5&quot; aria-selected=&quot;false&quot;&gt;5 · Check&lt;/button&gt;
&lt;button type=&quot;button&quot; class=&quot;nav-link&quot; id=&quot;journey-t6&quot; role=&quot;tab&quot; aria-controls=&quot;journey-s6&quot; aria-selected=&quot;false&quot;&gt;6 · Outcome&lt;/button&gt;
&lt;/div&gt;
&lt;section id=&quot;journey-s1&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;journey-t1&quot;&gt;
&lt;div class=&quot;story&quot;&gt;
&lt;div class=&quot;phone&quot; aria-label=&quot;Chat screen concept&quot;&gt;
&lt;header&gt;&lt;strong&gt;Leash permission assistant&lt;/strong&gt;&lt;span class=&quot;small&quot;&gt;Spending not enabled&lt;/span&gt;&lt;/header&gt;
&lt;div class=&quot;bubble&quot;&gt;Buy a 27-inch monitor for my home office. Spend no more than CHF 400.&lt;/div&gt;
&lt;div class=&quot;reply&quot;&gt;I understood one 27-inch monitor, up to CHF 400. Let’s check a couple of details before the shopping agent can spend.&lt;/div&gt;
&lt;div class=&quot;permission&quot;&gt;&lt;span class=&quot;small&quot;&gt;DRAFT PERMISSION&lt;/span&gt;&lt;div&gt;Item&lt;b&gt;27-inch monitor&lt;/b&gt;&lt;/div&gt;&lt;div&gt;Quantity&lt;b&gt;One&lt;/b&gt;&lt;/div&gt;&lt;div&gt;Budget&lt;b&gt;Up to CHF 400&lt;/b&gt;&lt;/div&gt;&lt;div&gt;Still to clarify&lt;b&gt;Delivery, extras, uncertainty&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;composer&quot;&gt;Type a message…&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;notes&quot;&gt;&lt;div&gt;&lt;strong&gt;Customer goal&lt;/strong&gt;&lt;p&gt;Describe the purchase naturally.&lt;/p&gt;&lt;/div&gt;&lt;div&gt;&lt;strong&gt;Interface job&lt;/strong&gt;&lt;p&gt;Show what the chat understood as a visible draft permission.&lt;/p&gt;&lt;/div&gt;&lt;div&gt;&lt;strong&gt;Risk to avoid&lt;/strong&gt;&lt;p&gt;The assistant guesses restrictions or starts spending before confirmation.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;text-small text-muted&quot;&gt;Concept screens. Use the numbered steps to explore; the chat is illustrative.&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section id=&quot;journey-s2&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;journey-t2&quot; hidden&gt;
&lt;div class=&quot;story&quot;&gt;
&lt;div class=&quot;phone&quot; aria-label=&quot;Clarification screen concept&quot;&gt;&lt;header&gt;&lt;strong&gt;A few details&lt;/strong&gt;&lt;span class=&quot;small&quot;&gt;Draft permission&lt;/span&gt;&lt;/header&gt;
&lt;div class=&quot;reply&quot;&gt;Should the CHF 400 include delivery and any taxes?&lt;/div&gt;&lt;div class=&quot;bubble&quot;&gt;Yes, everything.&lt;/div&gt;
&lt;div class=&quot;reply&quot;&gt;May I add paid extras, such as a warranty?&lt;/div&gt;&lt;div class=&quot;bubble&quot;&gt;No extras.&lt;/div&gt;
&lt;div class=&quot;reply&quot;&gt;If an important detail is unclear, should I ask you or skip that offer?&lt;/div&gt;&lt;div class=&quot;choices&quot;&gt;&lt;span class=&quot;choice&quot;&gt;Ask me first&lt;/span&gt;&lt;span class=&quot;choice&quot;&gt;Skip that offer&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;composer&quot;&gt;Or answer in your own words…&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;notes&quot;&gt;&lt;div&gt;&lt;strong&gt;Customer goal&lt;/strong&gt;&lt;p&gt;Resolve what matters without filling out a long form.&lt;/p&gt;&lt;/div&gt;&lt;div&gt;&lt;strong&gt;Interface job&lt;/strong&gt;&lt;p&gt;Ask one short question at a time. Offer quick replies and free text. Update the draft as answers arrive.&lt;/p&gt;&lt;/div&gt;&lt;div&gt;&lt;strong&gt;Risk to avoid&lt;/strong&gt;&lt;p&gt;Hidden assumptions, contradictory amounts or questions that do not affect the purchase.&lt;/p&gt;&lt;/div&gt;&lt;div&gt;&lt;strong&gt;Next&lt;/strong&gt;&lt;p&gt;With “Ask me first,” the permission is ready for review.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section id=&quot;journey-s3&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;journey-t3&quot; hidden&gt;
&lt;div class=&quot;story&quot;&gt;
&lt;div class=&quot;phone&quot; aria-label=&quot;Permission confirmation screen concept&quot;&gt;&lt;header&gt;&lt;strong&gt;Your wallet permission&lt;/strong&gt;&lt;span class=&quot;small&quot;&gt;Review before spending&lt;/span&gt;&lt;/header&gt;
&lt;div class=&quot;status&quot;&gt;May the agent shop under these limits?&lt;/div&gt;
&lt;div class=&quot;permission&quot;&gt;&lt;div&gt;Buy&lt;b&gt;One 27-inch monitor&lt;/b&gt;&lt;/div&gt;&lt;div&gt;Maximum total&lt;b&gt;CHF 400&lt;/b&gt;&lt;/div&gt;&lt;div&gt;Delivery and taxes&lt;b&gt;Included in the limit&lt;/b&gt;&lt;/div&gt;&lt;div&gt;Paid extras&lt;b&gt;Not allowed&lt;/b&gt;&lt;/div&gt;&lt;div&gt;Unclear details&lt;b&gt;Ask me first&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p&gt;The agent may complete a purchase that fits this permission without asking again.&lt;/p&gt;
&lt;div class=&quot;action&quot;&gt;Confirm this permission&lt;/div&gt;&lt;div class=&quot;action secondary&quot;&gt;Change details&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;notes&quot;&gt;&lt;div&gt;&lt;strong&gt;The consent moment&lt;/strong&gt;&lt;p&gt;The customer approves the meaning of the extracted rules, not merely a chat message.&lt;/p&gt;&lt;/div&gt;&lt;div&gt;&lt;strong&gt;Interface job&lt;/strong&gt;&lt;p&gt;Make item, quantity, full cost and exception handling readable. Keep changes easy.&lt;/p&gt;&lt;/div&gt;&lt;div&gt;&lt;strong&gt;Risk to avoid&lt;/strong&gt;&lt;p&gt;A reassuring summary that differs from the permission actually activated.&lt;/p&gt;&lt;/div&gt;&lt;div&gt;&lt;strong&gt;Real-product requirement&lt;/strong&gt;&lt;p&gt;Authenticate the customer’s confirmation of this exact permission.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section id=&quot;journey-s4&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;journey-t4&quot; hidden&gt;
&lt;div class=&quot;story&quot;&gt;
&lt;div class=&quot;phone&quot; aria-label=&quot;Active shopping screen concept&quot;&gt;&lt;header&gt;&lt;strong&gt;Shopping for your monitor&lt;/strong&gt;&lt;span class=&quot;small&quot;&gt;Permission active&lt;/span&gt;&lt;/header&gt;
&lt;div class=&quot;permission&quot;&gt;One 27-inch monitor · CHF 400 total · No extras&lt;/div&gt;
&lt;ol&gt;&lt;li&gt;External agent: comparing monitors&lt;/li&gt;&lt;li&gt;Found a 27-inch monitor for CHF 379&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Checking the full order against your permission&lt;/strong&gt;&lt;/li&gt;&lt;/ol&gt;
&lt;div class=&quot;reply&quot;&gt;You don’t need to approve every offer. I’ll ask if something important is unclear.&lt;/div&gt;
&lt;div class=&quot;action secondary&quot;&gt;Stop shopping&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;notes&quot;&gt;&lt;div&gt;&lt;strong&gt;Customer goal&lt;/strong&gt;&lt;p&gt;Let the agent work without losing visibility or control.&lt;/p&gt;&lt;/div&gt;&lt;div&gt;&lt;strong&gt;Interface job&lt;/strong&gt;&lt;p&gt;Keep the permission and stop action available. Show actual progress.&lt;/p&gt;&lt;/div&gt;&lt;div&gt;&lt;strong&gt;Risk to avoid&lt;/strong&gt;&lt;p&gt;Confusing “found an offer,” “allowed to pay” and “payment completed.”&lt;/p&gt;&lt;/div&gt;&lt;div&gt;&lt;strong&gt;Normal path&lt;/strong&gt;&lt;p&gt;A purchase within permission proceeds without another question.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section id=&quot;journey-s5&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;journey-t5&quot; hidden&gt;
&lt;div class=&quot;story&quot;&gt;
&lt;div class=&quot;phone&quot; aria-label=&quot;Customer intervention screen concept&quot;&gt;&lt;header&gt;&lt;strong&gt;Your wallet needs an answer&lt;/strong&gt;&lt;span class=&quot;small&quot;&gt;Purchase paused&lt;/span&gt;&lt;/header&gt;
&lt;div class=&quot;status&quot;&gt;Return terms are missing&lt;/div&gt;
&lt;div class=&quot;permission&quot;&gt;&lt;div&gt;Item&lt;b&gt;One 27-inch monitor&lt;/b&gt;&lt;/div&gt;&lt;div&gt;Total with delivery&lt;b&gt;CHF 379&lt;/b&gt;&lt;/div&gt;&lt;div&gt;Extras&lt;b&gt;None&lt;/b&gt;&lt;/div&gt;&lt;div&gt;Return terms&lt;b&gt;Not provided&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p&gt;The item and price fit your permission, but the seller has not provided return terms. Buy it with that uncertainty?&lt;/p&gt;
&lt;div class=&quot;action&quot;&gt;Buy this one for CHF 379&lt;/div&gt;&lt;div class=&quot;action secondary&quot;&gt;Find another&lt;/div&gt;
&lt;p class=&quot;small&quot;&gt;Your spending limit stays the same. This answer applies only to this purchase.&lt;/p&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) =&gt; {
    lastPointerWasTouch =
      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;
  };
  const handleTouchClick = (event) =&gt; {
    const isTouch = event.pointerType === &quot;touch&quot; || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch &amp;&amp; activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() =&gt; {
      if (activeTrigger === trigger &amp;&amp; !trigger.isConnected) {
        closeTooltip(false);
      }
    }, 0);
  };
  const handleLeave = (event) =&gt; {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    lastPointerWasTouch = false;
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerdown&quot;, handlePointer);
    document.removeEventListener(&quot;pointercancel&quot;, handlePointer);
    document.removeEventListener(&quot;click&quot;, handleTouchClick);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerdown&quot;, handlePointer);
  document.addEventListener(&quot;pointercancel&quot;, handlePointer);
  document.addEventListener(&quot;click&quot;, handleTouchClick);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-tabs&quot;&gt;
(() =&gt; {
  const selector = &#x27;.nav[role=&quot;tablist&quot;] [role=&quot;tab&quot;]&#x27;;
  const disabled = &#x27;:disabled,[aria-disabled=&quot;true&quot;]&#x27;;
  const selectTab = (selected) =&gt; {
    const panelId = selected.getAttribute(&quot;aria-controls&quot;);
    for (const tab of selected.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;)) {
      const active = tab === selected;
      tab.classList.toggle(&quot;active&quot;, active);
      tab.setAttribute(&quot;aria-selected&quot;, String(active));
      const id = tab.getAttribute(&quot;aria-controls&quot;);
      const panel = id &amp;&amp; document.getElementById(id);
      if (panel != null) {
        panel.hidden = id !== panelId;
        if (!panel.hidden &amp;&amp; selected.id) {
          panel.setAttribute(&quot;aria-labelledby&quot;, selected.id);
        }
      }
    }
  };
  const interact = (event) =&gt; {
    const tab = event.target?.closest?.(selector);
    if (event.defaultPrevented || tab == null || tab.matches(disabled)) {
      return;
    }
    if (event.type === &quot;click&quot;) {
      selectTab(tab);
      return;
    }
    const tabs = Array.from(
      tab.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;),
    ).filter((candidate) =&gt; !candidate.matches(disabled));
    const current = tabs.indexOf(tab);
    let next;
    if (event.key === &quot;ArrowRight&quot; || event.key === &quot;ArrowDown&quot;) {
      next = (current + 1) % tabs.length;
    } else if (event.key === &quot;ArrowLeft&quot; || event.key === &quot;ArrowUp&quot;) {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === &quot;Home&quot;) {
      next = 0;
    } else if (event.key === &quot;End&quot;) {
      next = tabs.length - 1;
    } else {
      return;
    }
    event.preventDefault();
    tabs[next].focus();
    selectTab(tabs[next]);
  };

  for (const list of document.querySelectorAll(&#x27;.nav[role=&quot;tablist&quot;]&#x27;)) {
    const selected =
      list.querySelector(&#x27;[role=&quot;tab&quot;][aria-selected=&quot;true&quot;]&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;].active&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;]&#x27;);
    if (selected != null) {
      selectTab(selected);
    }
  }
  document.addEventListener(&quot;click&quot;, interact);
  document.addEventListener(&quot;keydown&quot;, interact);
  window.addEventListener(&quot;pagehide&quot;, () =&gt; {
    document.removeEventListener(&quot;click&quot;, interact);
    document.removeEventListener(&quot;keydown&quot;, interact);
  }, { once: true });
})();
&lt;/script&gt;

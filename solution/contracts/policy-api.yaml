# Leash policy service API (contract-first, LEASH-118). Examples are validated by
# solution/engine/tests/contracts/test_examples_validate.py and served by mock_server.py.
openapi: 3.1.0
info:
  title: Leash policy service
  version: 0.1.0
  description: 'Contract between the customer app and the Leash backend (LEASH-118). Money is a decimal string. Errors use
    the Viseca shape {"error": {"code", "message"}}. Decisions referenced as DEC- are in solution/docs/decisions.md.'
servers:
- url: http://localhost:8787
  description: mock server (solution/contracts/mock_server.py)
paths:
  /api/policies/drafts:
    post:
      operationId: createDraft
      summary: Compile the customer's instruction into a local draft
      tags:
      - policy
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyDraft'
              examples:
                with_question:
                  value:
                    draft_id: LD-01
                    revision: 1
                    instruction: Buy the 27-inch monitor I chose, from a seller I have bought from before, for CHF 400 or
                      less. Do not add anything I did not ask for. Ask me when uncertain.
                    status: needs_answers
                    rules:
                    - text: At most CHF 400.00 per order, delivery included
                      source: customer
                      decision: null
                      tightened: false
                    - text: Only the 27-inch computer monitor
                      source: customer
                      decision: null
                      tightened: false
                    - text: Only shops you have paid before
                      source: customer
                      decision: DEC-015
                      tightened: false
                    - text: 'Nothing extra: no add-ons, plans or vouchers'
                      source: customer
                      decision: null
                      tightened: false
                    - text: One purchase; ask me before a second
                      source: team
                      decision: DEC-013
                      tightened: false
                    hard_rules:
                    - field: authorization.billing_amount_chf
                      operator: <=
                      value: 400
                      currency: CHF
                      scope: purchase
                    - field: items.item_id
                      operator: in
                      value:
                      - IT0017
                    - field: leash.merchant.prior_purchases.v1
                      operator: '>='
                      value: 1
                    - field: leash.items.unrequested_count.v1
                      operator: '='
                      value: 0
                    - field: leash.purchase.max_count.v2
                      operator: <=
                      value: 1
                    uncertainty_policy: ask
                    notes:
                    - '"The monitor I chose" = the 27-inch computer monitor (catalogue item IT0017).'
                    open_questions:
                    - question_id: Q1
                      text: Should a shop you paid earlier in this same run count as "bought from before"?
                      options:
                      - 'yes'
                      - 'no'
                      blocking: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDraftRequest'
            examples:
              monitor:
                value:
                  instruction: Buy the 27-inch monitor I chose, from a seller I have bought from before, for CHF 400 or less.
                    Do not add anything I did not ask for. Ask me when uncertain.
  /api/policies/drafts/{draft_id}/answers:
    post:
      operationId: answerDraftQuestions
      summary: Answer clarifying questions; accepted answers add to the draft
      tags:
      - policy
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyDraft'
              examples:
                ready:
                  value:
                    draft_id: LD-01
                    revision: 1
                    instruction: Buy the 27-inch monitor I chose, from a seller I have bought from before, for CHF 400 or
                      less. Do not add anything I did not ask for. Ask me when uncertain.
                    status: ready
                    rules:
                    - text: At most CHF 400.00 per order, delivery included
                      source: customer
                      decision: null
                      tightened: false
                    - text: Only the 27-inch computer monitor
                      source: customer
                      decision: null
                      tightened: false
                    - text: Only shops you have paid before
                      source: customer
                      decision: DEC-015
                      tightened: false
                    - text: 'Nothing extra: no add-ons, plans or vouchers'
                      source: customer
                      decision: null
                      tightened: false
                    - text: One purchase; ask me before a second
                      source: team
                      decision: DEC-013
                      tightened: false
                    hard_rules:
                    - field: authorization.billing_amount_chf
                      operator: <=
                      value: 400
                      currency: CHF
                      scope: purchase
                    - field: items.item_id
                      operator: in
                      value:
                      - IT0017
                    - field: leash.merchant.prior_purchases.v1
                      operator: '>='
                      value: 1
                    - field: leash.items.unrequested_count.v1
                      operator: '='
                      value: 0
                    - field: leash.purchase.max_count.v2
                      operator: <=
                      value: 1
                    uncertainty_policy: ask
                    notes:
                    - '"The monitor I chose" = the 27-inch computer monitor (catalogue item IT0017).'
                    open_questions: []
        '409':
          description: Already posted to Viseca (no draft updates there); start a new draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                example:
                  value:
                    error:
                      code: already_submitted
                      message: This draft is already at Viseca; start a new one to change it.
        '422':
          description: Bad body, not an open question, not one of its options, an empty answer, or an answer that
            doesn't answer its question (unclear, or gives nothing for that question); the reason is in the message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                example:
                  value:
                    error:
                      code: invalid_answer
                      message: 'answer one of: Ask me, Decline, Approve'
        '404':
          description: Unknown draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                example:
                  value:
                    error:
                      code: draft_not_found
                      message: No draft with this ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnswersRequest'
            examples:
              'yes':
                value:
                  answers:
                  - question_id: Q1
                    answer: 'Yes'
      parameters:
      - name: draft_id
        in: path
        required: true
        schema:
          type: string
  /api/policies/drafts/{draft_id}/submit:
    post:
      operationId: submitDraft
      summary: Post the finished policy to Viseca as a platform draft
      tags:
      - policy
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitRequest'
            examples:
              reviewed:
                value:
                  revision: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformDraft'
              examples:
                posted:
                  value:
                    draft_id: LD-01
                    platform_draft_id: DR-9921
                    instruction: Buy the 27-inch monitor I chose, from a seller I have bought from before, for CHF 400 or
                      less. Do not add anything I did not ask for. Ask me when uncertain.
                    hard_rules:
                    - field: authorization.billing_amount_chf
                      operator: <=
                      value: 400
                      currency: CHF
                      scope: purchase
                    - field: items.item_id
                      operator: in
                      value:
                      - IT0017
                    - field: leash.merchant.prior_purchases.v1
                      operator: '>='
                      value: 1
                    - field: leash.items.unrequested_count.v1
                      operator: '='
                      value: 0
                    - field: leash.purchase.max_count.v2
                      operator: <=
                      value: 1
                    uncertainty_policy: ask
                    guidance:
                    - Rules use the leash. field registry v1.
                    open_questions: []
        '409':
          description: Blocking questions remain
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                example:
                  value:
                    error:
                      code: questions_open
                      message: Answer the open questions before submitting.
      parameters:
      - name: draft_id
        in: path
        required: true
        schema:
          type: string
  /api/policies/drafts/{draft_id}/confirm:
    post:
      operationId: confirmDraft
      summary: Customer confirms; the mandate becomes active (idempotent)
      tags:
      - policy
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mandate'
              examples:
                active:
                  value:
                    mandate_id: TM-5521

                      currency: CHF
                      scope: purchase
                    - field: items.item_id
                      operator: in
                      value:
                      - IT0017
                    - field: leash.merchant.prior_purchases.v1
                      operator: '>='
                      value: 1
                    - field: leash.items.unrequested_count.v1
                      operator: '='
                      value: 0
                    - field: leash.purchase.max_count.v2
                      operator: <=
                      value: 1
                    uncertainty_policy: ask
                    applies_from: next run
                    revocation: null
        '409':
          description: Not submitted yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                example:
                  value:
                    error:
                      code: not_submitted
                      message: Submit the draft to Viseca before confirming.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmRequest'
            examples:
              confirm:
                value:
                  confirmed: true
      parameters:
      - name: draft_id
        in: path
        required: true
        schema:
          type: string
  /api/policies/drafts/{draft_id}:

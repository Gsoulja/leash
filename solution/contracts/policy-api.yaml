      - name: mandate_id
        in: path
        required: true
        schema:
          type: string
  /api/mandates/{mandate_id}/tighten:
    post:
      operationId: tightenMandate
      summary: Append stricter rules or switch uncertainty to decline
      tags:
      - policy
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mandate'
              examples:
                lower_limit:
                  value:
                    mandate_id: TM-5521
                    version: 2
                    status: active
                    instruction: Buy the 27-inch monitor I chose, from a seller I have bought from before, for CHF 400 or
                      less. Do not add anything I did not ask for. Ask me when uncertain.
                    rules:
                    - text: At most CHF 400.00 per order, delivery included

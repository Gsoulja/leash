              schema:
                type: string
              examples:
                ask:
                  value: 'id: 41

                    event: ask.created

                    data: {"id": "41", "type": "ask.created", "at": "2026-09-23T14:00:00Z", "data": {"authorization_id": "AZ-81c2",
                    "merchant_name": "PixelHarbor", "billing_amount_chf": "289.00", "reasons": ["Same shop, items and price
                    as the order at 11:40 (already paid)."], "expires_at": "2026-09-23T14:02:00Z", "can_approve": true}}


                    '
components:
  schemas:
    Money:
      type: string
      pattern: ^-?\d+\.\d{2}$
      description: Decimal amount as a string, two decimals (never a JSON number).
    Error:
      type: object
      required:
      - error
      additionalProperties: false
      description: Same shape as the Viseca API's errors.
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
            message:
              type: string
    HardRule:
      type: object
      required:
      - field
      - operator
      - value
      additionalProperties: false
      description: Exactly the Viseca rule format. Our own fields use the versioned `leash.` registry (DEC-004).
      properties:
        field:
          type: string
          minLength: 1
        operator:
          type: string
          enum:
          - <
          - <=
          - '='
          - '!='
          - '>'
          - '>='
          - in
          - not_in
        value:
          anyOf:
          - type: number
          - type: string
          - type: array
            items:
              type: string
        currency:
          type:
          - string
          - 'null'
          enum:
          - CHF
          - EUR
          - GBP
          - USD
          - null
        scope:
          type:
          - string
          - 'null'
          enum:
          - purchase
          - period
          - null
        period_days:
          type:
          - integer
          - 'null'
          minimum: 1
    RuleView:
      type: object
      required:
      - text
      - source
      - tightened
      additionalProperties: false
      description: One rule in plain language, as shown to the customer.
      properties:
        text:
          type: string
        source:
          type: string
          enum:
          - viseca
          - team
          - assumption
          - customer
        decision:
          type:
          - string
          - 'null'
          description: DEC- id when the reading comes from the decision log
        tightened:
          type: boolean
    Question:
      type: object
      required:
      - question_id
      - text
      - blocking
      additionalProperties: false
      properties:
        question_id:
          type: string
        text:
          type: string
        options:
          type: array
          items:
            type: string
        blocking:
          type: boolean
    CreateDraftRequest:
      type: object
      required:
      - instruction
      additionalProperties: false
      properties:
        instruction:
          type: string
          minLength: 1
    PolicyDraft:
      type: object
      additionalProperties: false
      required:
      - draft_id
      - revision
      - instruction
      - status
      - rules
      - hard_rules
      - uncertainty_policy
      - notes
      - open_questions
      description: 'Local draft: not yet sent to Viseca (DEC-003, LEASH-123).'
      properties:
        draft_id:
          type: string
        revision:
          type: integer
          minimum: 1
          description: 'Which revision of this draft you are looking at (LEASH-101). A correction
            before activation creates the next revision and marks the previous one superseded;
            submit and confirm may name the revision that was reviewed and refuse a stale one.'
        instruction:
          type: string
        status:
          type: string
          enum:
          - needs_answers
          - ready
        rules:
          type: array
          items:
            $ref: '#/components/schemas/RuleView'
        hard_rules:
          type: array
          items:
            $ref: '#/components/schemas/HardRule'
        uncertainty_policy:
          type: string
          enum:
          - ask
          - decline
          - approve
        notes:
          type: array
          items:
            type: string
        open_questions:
          type: array
          items:
            $ref: '#/components/schemas/Question'
    AnswersRequest:
      type: object
      required:
      - answers
      additionalProperties: false
      properties:
        answers:
          type: array
          minItems: 1
          items:
            type: object
            required:
            - question_id
            - answer
            additionalProperties: false
            properties:
              question_id:
                type: string
              answer:
                type: string
    PlatformDraft:
      type: object
      additionalProperties: false
      required:
      - draft_id
      - platform_draft_id
      - instruction
      - hard_rules
      - uncertainty_policy
      - guidance
      description: Exactly what was posted to Viseca; shown to the customer before confirming.
      properties:
        draft_id:
          type: string
        platform_draft_id:
          type: string
        instruction:
          type: string
        hard_rules:
          type: array
          items:
            $ref: '#/components/schemas/HardRule'
        uncertainty_policy:
          type: string
          enum:
          - ask
          - decline
          - approve
        guidance:
          type: array
          items:
            type: string
        open_questions:
          type: array
          items:
            type: string
    ConfirmRequest:
      type: object
      required:
      - confirmed
      additionalProperties: false
      properties:
        confirmed:
          const: true
        revision:
          type: integer
          minimum: 1
          description: 'The draft revision the customer reviewed. Omit to confirm whatever is
            current; send it to be refused with 409 stale_revision if the draft moved on.'
    SubmitRequest:
      type: object
      additionalProperties: false
      description: 'Optional body for submitDraft (LEASH-101).'
      properties:
        revision:
          type: integer
          minimum: 1
          description: 'The draft revision the customer reviewed. Omit to submit whatever is
            current; send it to be refused with 409 stale_revision if the draft moved on.'
    Mandate:
      type: object
      additionalProperties: false
      required:
      - mandate_id
      - version
      - status
      - instruction
      - rules
      - hard_rules
      - uncertainty_policy
      properties:
        mandate_id:
          type: string
        version:
          type: integer
          minimum: 1
        status:
          type: string
          enum:
          - active
          - revoked
          - expired
        instruction:
          type: string
        rules:
          type: array
          items:
            $ref: '#/components/schemas/RuleView'
        hard_rules:
          type: array
          items:
            $ref: '#/components/schemas/HardRule'
        uncertainty_policy:
          type: string
          enum:
          - ask
          - decline
          - approve
        applies_from:
          type: string
          description: Changes apply to runs started after this version (DEC-006).
        revocation:
          type:
          - object
          - 'null'
          additionalProperties: false
          properties:
            platform_confirmed:
              type: boolean
            note:
              type:
              - string
              - 'null'
    TightenRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      description: 'Only stricter changes: rules are appended, uncertainty can only move to decline (DEC-006).'
      properties:
        add_hard_rules:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/HardRule'
        uncertainty_policy:
          const: decline
    StartRunRequest:
      type: object
      required:
      - scenario_id
      - mandate_id
      additionalProperties: false
      properties:
        scenario_id:
          type: string
        mandate_id:
          type: string
    Run:
      type: object
      additionalProperties: false
      required:
      - run_id
      - scenario_id
      - mandate_id
      - mandate_version
      - status
      properties:
        run_id:
          type: string
        scenario_id:
          type: string
        mandate_id:
          type: string
        mandate_version:
          type: integer
        status:
          type: string
          enum:
          - running
          - finished
          - failed
        counters:
          type: object
          additionalProperties:
            type: integer
    Payment:
      type: object
      required:
      - authorization_id
      - run_id
      - merchant
      - sim_time
      - amount
      - currency
      - billing_amount_chf
      - items
      - engine_verdict
      - final_state
      - delivery
      - platform_outcome
      - resolved_by
      - customer_message
      properties:
        authorization_id:
          type: string
        delivery:
          type: string
          enum:
          - pending
          - accepted
          - refused
          description: >-
            What the platform did with our decision, kept apart from the decision itself (LEASH-130).
            `pending` — decided and submitted, not yet acknowledged. `accepted` — the platform accepted
            the decision; that is all it means, and never that anything was settled, shipped or
            delivered. `refused` — terminally refused (for example `deadline_passed`); the purchase is
            then `not_sent` and counts toward nothing.
        platform_outcome:
          type:
          - string
          - 'null'
          description: What the platform said, verbatim where it said anything. Null while pending.
        source_authorization_id:
          type:
          - string
          - 'null'
        run_id:
          type: string
        merchant:
          type: object
          required:
          - merchant_id
          - name
          - category
          - country
          properties:
            merchant_id:
              type: string
            name:
              type: string
            category:
              type: string
            country:
              type: string
            city:
              type: string
        sim_time:
          type: string
          format: date-time
          description: Simulated purchase time
        amount:
          $ref: '#/components/schemas/Money'
        currency:
          type: string
          enum:
          - CHF
          - EUR
          - GBP
          - USD
        billing_amount_chf:
          $ref: '#/components/schemas/Money'
        items:
          type: array
          minItems: 1
          items:
            type: object
            required:
            - item_id
            - name
            - quantity
            properties:
              item_id:
                type: string
              name:
                type: string
              quantity:
                type: integer
                minimum: 1
              unit_price:
                $ref: '#/components/schemas/Money'
        engine_verdict:
          type:
          - string
          - 'null'
          enum:
          - approve
          - decline
          - step_up
          - null
        final_state:
          type: string
          enum:
          - approved
          - declined
          - waiting
          - timed_out
          - not_sent
          description: >-
            What the engine decided, and what the customer or the platform did about it. Read it with
            `delivery`, never alone: approved+accepted is shown as "Approved" — never "Paid", because the
            platform accepting a decision says nothing about settlement — approved+pending as
            "Approved · sending", waiting as "Waiting for you", declined as "Blocked", timed_out as "No
            answer". `not_sent` is either a purchase the platform rejected before it reached the engine
            (no verdict, e.g. permission revoked) or a decision it terminally refused (delivery
            `refused`); the two read differently in the app.
        resolved_by:
          type:
          - string
          - 'null'
          enum:
          - engine
          - customer
          - platform
          - null
        customer_message:
          type: string
    PaymentList:
      type: object
      required:
      - payments
      additionalProperties: false
      properties:
        payments:
          type: array
          items:
            $ref: '#/components/schemas/Payment'
    Check:
      type: object
      required:
      - key
      - label
      - status
      - agreed
      - actual
      - detail
      additionalProperties: false
      properties:
        key:
          type: string
        label:
          type: string
        status:
          type: string
          enum:
          - pass
          - fail
          - warn
          - info
          - integrity
        agreed:
          type: string
        actual:
          type: string
        detail:
          type: string
        reason_code:
          type:
          - string
          - 'null'
    PaymentDetail:
      allOf:
      - $ref: '#/components/schemas/Payment'
      - type: object
        required:
        - checks
        - evidence
        - shop_texts
        - sent_to_viseca
        - engine_version
        - reader
        properties:
          checks:
            type: array
            items:
              $ref: '#/components/schemas/Check'
          evidence:
            type: array
            items:
              type: string
          shop_texts:
            type: array
            description: 'Merchant text: untrusted, render as plain text.'
            items:
              type: object
              required:
              - item_id
              - text
              properties:
                item_id:
                  type: string
                text:
                  type: string
          sent_to_viseca:
            type:
            - object
            - 'null'
            description: The body POSTed to /v1/authorizations/{id}/decision; null when nothing was sent.
          engine_version:
            type: string
          reader:
            type: object
            required:
            - name
            - model_unavailable
            properties:
              name:
                type: string
              model_unavailable:
                type: boolean
    Ask:
      type: object
      additionalProperties: false
      required:
      - authorization_id
      - payment
      - reasons
      - passed
      - expires_at
      - can_approve
      - cannot_approve_reason
      properties:
        authorization_id:
          type: string
        payment:
          $ref: '#/components/schemas/Payment'
        reasons:
          type: array
          items:
            type: string
        passed:
          type: array
          items:
            type: string
        expires_at:
          type: string
          format: date-time
          description: Real clock; the app counts down from this (DEC-008).
        can_approve:
          type: boolean
          description: False when a hard rule now fails (DEC-012).
        cannot_approve_reason:
          type:
          - string
          - 'null'
    AskList:
      type: object
      required:
      - asks
      additionalProperties: false
      properties:
        asks:
          type: array
          items:
            $ref: '#/components/schemas/Ask'
    AnswerRequest:
      type: object
      required:
      - decision
      additionalProperties: false
      properties:
        decision:
          type: string
          enum:
          - approve
          - decline
    Spending:
      type: object
      additionalProperties: false
      required:
      - run_id
      - period_days
      - limit_chf
      - approved_chf
      - accepted_chf
      - awaiting_platform_chf
      - remaining_chf
      - platform_counter_chf
      - mismatch
      properties:
        run_id:
          type: string
        period_days:
          type:
          - integer
          - 'null'
        limit_chf:
          anyOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
        approved_chf:
          description: What the engine approved. The limit is enforced against this, so spend still
            awaiting the platform's acknowledgement is already reserved and cannot be spent twice.
          $ref: '#/components/schemas/Money'
        accepted_chf:
          description: The part the platform has accepted. Never proof of settlement, shipment or
            delivery — only that the authorization decision was accepted.
          $ref: '#/components/schemas/Money'
        awaiting_platform_chf:
          description: Approved locally, not yet acknowledged. Reserved, not spendable again.
          $ref: '#/components/schemas/Money'
        remaining_chf:
          anyOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
        platform_counter_chf:
          anyOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
        mismatch:
          type: boolean
          description: Our ledger and the platform counter disagree (DEC-010).
    MandateList:
      type: object
      required:
      - mandates
      - current_mandate_id
      additionalProperties: false
      properties:
        mandates:
          type: array
          items:
            $ref: '#/components/schemas/Mandate'
        current_mandate_id:
          type:
          - string
          - 'null'
          description: The active mandate, if any.
    MandateVersion:
      type: object
      required:
      - version
      - change
      - hard_rules
      - uncertainty_policy
      - created_at
      additionalProperties: false
      properties:
        version:
          type: integer
          minimum: 1
        change:
          type: string
          enum:
          - confirmed
          - tightened
          - revoked
          - expired
        hard_rules:
          type: array
          items:
            $ref: '#/components/schemas/HardRule'
        uncertainty_policy:
          type: string
          enum:
          - ask
          - decline
          - approve
        created_at:
          type: string
          format: date-time
    MandateVersionList:
      type: object
      required:
      - mandate_id
      - versions
      additionalProperties: false
      properties:
        mandate_id:
          type: string
        versions:
          type: array
          items:
            $ref: '#/components/schemas/MandateVersion'
    RunList:
      type: object
      required:
      - runs
      - current_run_id
      additionalProperties: false
      properties:
        runs:
          type: array
          items:
            $ref: '#/components/schemas/Run'
        current_run_id:
          type:
          - string
          - 'null'
          description: The run still in progress, if any.
    AskCreatedData:
      type: object
      additionalProperties: false
      required:
      - authorization_id
      - merchant_name
      - billing_amount_chf
      - reasons
      - expires_at
      - can_approve
      properties:
        authorization_id:
          type: string
        merchant_name:
          type: string
        billing_amount_chf:
          $ref: '#/components/schemas/Money'
        reasons:
          type: array
          items:
            type: string
        expires_at:
          type: string
          format: date-time
        can_approve:
          type: boolean
    AskResolvedData:
      type: object
      additionalProperties: false
      required:
      - authorization_id
      - outcome
      - resolved_by
      properties:
        authorization_id:
          type: string
        outcome:
          type: string
          enum:
          - approved
          - declined
          - timed_out
        resolved_by:
          type: string
          enum:
          - customer
          - platform
    PaymentDecidedData:
      type: object
      additionalProperties: false
      required:
      - authorization_id
      - engine_verdict
      - final_state
      - billing_amount_chf
      - customer_message
      properties:
        authorization_id:
          type: string
        engine_verdict:
          type: string
          enum:
          - approve
          - decline
          - step_up
        final_state:
          type: string
          enum:
          - approved
          - declined
          - waiting
        billing_amount_chf:
          $ref: '#/components/schemas/Money'
        customer_message:
          type: string
    MandateChangedData:
      type: object
      additionalProperties: false
      required:
      - mandate_id
      - version
      - status
      - change
      properties:
        mandate_id:
          type: string
        version:
          type: integer
          minimum: 1
        status:
          type: string
          enum:
          - active
          - revoked
          - expired
        change:
          type: string
          enum:
          - confirmed
          - tightened
          - revoked
          - expired
    PaymentDeliveredData:
      type: object
      additionalProperties: false
      required:
      - authorization_id
      - delivery
      - platform_outcome
      - final_state
      description: >-
        What the platform did with a decision already made (LEASH-130). Never a new verdict: the engine
        decided earlier, and this says only whether the answer was accepted. `accepted` is not evidence
        of settlement, shipment or delivery.
      properties:
        authorization_id:
          type: string
        delivery:
          type: string
          enum:
          - accepted
          - refused
        platform_outcome:
          type:
          - string
          - 'null'
        final_state:
          type: string
          enum:
          - approved
          - declined
          - waiting
          - timed_out
          - not_sent
    IntegrityAlertData:
      type: object
      additionalProperties: false
      required:
      - kind
      - run_id
      - detail
      properties:
        kind:
          type: string
          enum:
          - spend_counter_mismatch
          - unsupported_mandate_rule
          - mandate_snapshot_mismatch
          - amount_mismatch
          - platform_delivery_mismatch
        run_id:
          type:
          - string
          - 'null'
        detail:
          type: string
    StreamEvent:
      type: object
      required:
      - id
      - type
      - at
      - data
      additionalProperties: false
      properties:
        id:
          type: string
        type:
          type: string
          enum:
          - ask.created
          - ask.resolved
          - payment.decided
          - payment.delivered
          - mandate.changed
          - integrity.alert
        at:
          type: string
          format: date-time
        data:
          type: object
      allOf:
      - if:
          properties:
            type:
              const: ask.created
        then:
          properties:
            data:
              $ref: '#/components/schemas/AskCreatedData'
      - if:
          properties:
            type:
              const: ask.resolved
        then:
          properties:
            data:
              $ref: '#/components/schemas/AskResolvedData'
      - if:
          properties:
            type:
              const: payment.delivered
        then:
          properties:
            data:
              $ref: '#/components/schemas/PaymentDeliveredData'
      - if:
          properties:
            type:
              const: payment.decided
        then:
          properties:
            data:
              $ref: '#/components/schemas/PaymentDecidedData'
      - if:
          properties:
            type:
              const: mandate.changed
        then:
          properties:
            data:
              $ref: '#/components/schemas/MandateChangedData'
      - if:
          properties:
            type:
              const: integrity.alert
        then:
          properties:
            data:
              $ref: '#/components/schemas/IntegrityAlertData'

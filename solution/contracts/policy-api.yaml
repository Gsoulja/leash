                      source: team
                      decision: DEC-013
                      tightened: false
                    - text: At most CHF 350.00 per order, delivery included
                      source: customer
                      decision: null
                      tightened: true
                    hard_rules:
                    - field: authorization.billing_amount_chf
                      operator: <=
                      value: 400
                      currency: CHF
                      scope: purchase
                    - field: items.item_id
                      operator: in
                      value:
                      - IT0017
                    - field: leash.merchant.prior_purchases.v1
                      operator: '>='
                      value: 1
                    - field: leash.items.unrequested_count.v1
                      operator: '='
                      value: 0
                    - field: leash.purchase.max_count.v2
                      operator: <=
                      value: 1
                    - field: authorization.billing_amount_chf
                      operator: <=
                      value: 350
                      currency: CHF
                      scope: purchase
                    uncertainty_policy: ask
                    applies_from: next run
                    revocation: null
        '422':
          description: Would loosen the permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                example:
                  value:
                    error:
                      code: would_loosen
                      message: A limit can only go down. Create a new permission to loosen it.
        '404':
          description: No such mandate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                example:
                  value:
                    error:
                      code: mandate_not_found
                      message: No mandate with this ID.
        '409':
          description: Not active, or Viseca refused the change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                example:
                  value:
                    error:
                      code: mandate_not_active
                      message: Only an active mandate can be tightened.
        '502':
          description: Viseca did not answer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                example:
                  value:
                    error:
                      code: platform_error
                      message: Viseca did not accept the change; nothing was stored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TightenRequest'
            examples:
              lower_limit:
                value:
                  add_hard_rules:
                  - field: authorization.billing_amount_chf
                    operator: <=
                    value: 350
                    currency: CHF
                    scope: purchase
              decline_when_unsure:
                value:
                  uncertainty_policy: decline
      parameters:
      - name: mandate_id
        in: path
        required: true
        schema:
          type: string
  /api/runs:
    post:
      operationId: startRun

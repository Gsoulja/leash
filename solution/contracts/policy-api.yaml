          description: Viseca did not answer; the mandate is still active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                example:
                  value:
                    error:
                      code: platform_error
                      message: Viseca did not revoke it; it is still active.

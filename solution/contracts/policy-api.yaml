                      tightened: false
                    - text: Only shops you have paid before
                      source: customer
                      decision: DEC-015
                      tightened: false
                    - text: 'Nothing extra: no add-ons, plans or vouchers'
                      source: customer
                      decision: null
                      tightened: false
                    - text: One purchase; ask me before a second

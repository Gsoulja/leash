[project]
name = "leash-engine"
version = "0.1.0"
description = "Wallet control layer for AI shopping agents (Viseca Agent on a Leash challenge)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "asyncpg>=0.29",
    "httpx>=0.27",
    "alembic>=1.13",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "jsonschema>=4.20",
]


[project.scripts]
leash-worker = "leash.adapters.viseca_api.worker:main"
leash-api = "leash.service:main"
leash-migrate = "leash.adapters.postgres.migrate:main"

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "mypy>=2.3.1",
    "pytest>=8.3",
    "pyyaml>=6.0.3",
    "types-jsonschema>=4.26.0.20260518",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leash"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.mypy.overrides]]
# asyncpg ships no type information; its use stays inside the Postgres adapters.
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true
